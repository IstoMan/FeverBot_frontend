name: manifesto

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  connectivity_plus: ^7.1.1
  dartz: ^0.10.1
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_screenutil: ^5.9.3
  get: ^4.7.3
  get_storage: ^2.1.1
  google_fonts: ^8.0.2
  intl: ^0.20.2
  loading_animation_widget: ^1.3.0
  logger: ^2.7.0
  toastification: ^3.1.0
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Geist
      fonts:
        - asset: assets/google_fonts/Geist/Geist-Thin.ttf
          weight: 100
        - asset: assets/google_fonts/Geist/Geist-ExtraLight.ttf
          weight: 200
        - asset: assets/google_fonts/Geist/Geist-Light.ttf
          weight: 300
        - asset: assets/google_fonts/Geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Geist/Geist-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Geist/Geist-ExtraBold.ttf
          weight: 800
        - asset: assets/google_fonts/Geist/Geist-Black.ttf
          weight: 900
  assets:
    - .env